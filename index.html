<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>INFECFREAK FEST – Terminal Easter Egg (v11)</title>
  <style>
    :root{ --bg:#000; --green:#00ff8a; --red:#ff2b2b; }
    html,body{
      margin:0; height:100%; background:var(--bg); overflow:hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .stage{
      position:relative;
      width:min(100vw, 56.25vh);
      height:min(100vh, 177.78vw);
      aspect-ratio:9/16;
      margin:auto;
      top:50%;
      transform:translateY(-50%);
      background:#000;
      border-radius: 18px;
      overflow:hidden;
      box-shadow: 0 0 140px rgba(0,255,138,.10);
      user-select:none;
    }
    canvas{display:block;width:100%;height:100%;}
    .scanlines{
      pointer-events:none; position:absolute; inset:0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,.24) 3px,
        rgba(0,0,0,.24) 4px
      );
      mix-blend-mode: multiply;
      opacity:.72;
    }
    .noise{
      pointer-events:none; position:absolute; inset:0;
      opacity:.14; mix-blend-mode: screen;
      background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="240" height="240" filter="url(%23n)" opacity="0.60"/></svg>');
      background-size:260px 260px;
      animation: jitter 1100ms steps(2,end) infinite;
    }
    @keyframes jitter{
      0%{transform:translate(0,0)}
      25%{transform:translate(-1px,1px)}
      50%{transform:translate(1px,-1px)}
      75%{transform:translate(-1px,-1px)}
      100%{transform:translate(1px,1px)}
    }
    .vignette{
      pointer-events:none; position:absolute; inset:-8%;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,.40) 55%,
        rgba(0,0,0,.88) 100%);
      opacity:.95;
    }
    .flicker{
      pointer-events:none; position:absolute; inset:0;
      background: rgba(255,255,255,0.02);
      mix-blend-mode: overlay;
      opacity:0.0;
      animation: flicker 3.2s infinite;
    }
    @keyframes flicker{
      0%, 100% { opacity: 0.03; }
      10% { opacity: 0.08; }
      11% { opacity: 0.02; }
      38% { opacity: 0.06; }
      39% { opacity: 0.01; }
      65% { opacity: 0.07; }
      66% { opacity: 0.02; }
      87% { opacity: 0.05; }
    }
    .hint{
      position:absolute; left:12px; bottom:10px;
      color:rgba(0,255,138,.35);
      font-size:12px;
      letter-spacing:.02em;
      user-select:none;
      pointer-events:none;
    }
  </style>
</head>

<body>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="scanlines"></div>
    <div class="noise"></div>
    <div class="flicker"></div>
    <div class="vignette"></div>
    <div class="hint">Enter: EXECUTE • Click: Passline (pantalla tickets) • R: Reset</div>
  </div>

<script>
(() => {
  const WIDTH = 1080, HEIGHT = 1920;
  const GREEN = "#00ff8a";
  const GREEN_DIM = "rgba(0,255,138,0.16)";
  const GREEN_FAINT = "rgba(0,255,138,0.08)";
  const RED = "#ff2b2b";

  const PASSLINE_URL =
    "https://www.passline.com/eventos/infect-freak-fest?srsltid=AfmBOoohnJzXODKIHN93dhm9xkYYcX9ET9JngFko1BzMEPCKdaN2tVyx";

  const EVENT = {
    title: "INFECFREAK FEST",
    location: "FORO DMT, COLIMA",
    time: "7:00 PM",
    prices: ["PREVENTA $100", "GENERAL $150"],
    lineup: ["Speedfreak","Hand Grenade","Black Maiz","Los Mur","P4R4S1T0"]
  };

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  canvas.width = WIDTH;
  canvas.height = HEIGHT;

  // ===== audio =====
  let audioCtx = null;
  function beep(freq=240, dur=0.06, gain=0.05, type="sine") {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = gain;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  }
  const chirp = () => beep(420, 0.05, 0.045, "square");
  const doom  = () => beep(140, 0.16, 0.09, "sine");
  const tick  = () => beep(980, 0.02, 0.03, "square");

  // ===== state machine =====
  // 0 root prompt
  // 1 scan (animated + RUN scan.exe)
  // 2 access (animated + RUN access.exe)
  // 3 tickets
  const state = {
    screen: 0,
    screenStartMs: performance.now(),
    glitchUntil: 0,
    bendUntil: 0,
    passlineHit: null
  };

  function now(){ return performance.now(); }
  function sinceScreenStart(){ return (now() - state.screenStartMs) / 1000; } // seconds

  function clear(){
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,WIDTH,HEIGHT);
  }

  function shadowGlow(intensity=1){
    ctx.shadowColor = "rgba(0,255,138,0.35)";
    ctx.shadowBlur = 26 * intensity;
  }

  function text(x,y,str,size=44,color=GREEN,alpha=1,align="left",weight=400){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.font = `${weight} ${size}px ui-monospace, Menlo, Consolas, monospace`;
    ctx.textAlign = align;
    ctx.textBaseline = "top";
    ctx.fillText(str,x,y);
    ctx.restore();
  }

  function frameBorder(){
    ctx.save();
    ctx.globalAlpha = 0.20;
    ctx.strokeStyle = GREEN;
    ctx.lineWidth = 2;
    ctx.strokeRect(46,46,WIDTH-92,HEIGHT-92);
    ctx.globalAlpha = 0.10;
    ctx.strokeRect(70,70,WIDTH-140,HEIGHT-140);
    ctx.restore();
  }

  function drawGrid(){
    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.strokeStyle = GREEN;
    ctx.lineWidth = 1;
    for(let x=0; x<WIDTH; x+=120){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,HEIGHT); ctx.stroke();
    }
    for(let y=0; y<HEIGHT; y+=120){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(WIDTH,y); ctx.stroke();
    }
    ctx.restore();
  }

  function databend(){
    const bands = 7;
    for(let i=0;i<bands;i++){
      const y = Math.floor((HEIGHT * (0.16 + 0.1*i)) + (Math.random()*14-7));
      const h = Math.floor(10 + Math.random()*28);
      const dx = Math.floor((Math.random()*70 - 35));
      ctx.drawImage(canvas, 0, y, WIDTH, h, dx, y, WIDTH, h);
    }
  }

  function interference(){
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = GREEN;
    const y = 900 + Math.sin(now()/1000*6)*120;
    ctx.fillRect(0, y, WIDTH, 10);
    ctx.restore();
    if (Math.random() < 0.10) tick();
  }

  function drawBottomPrompt(nextLabel){
    shadowGlow(0.9);
    text(120, HEIGHT-210, "PRESS ENTER TO EXECUTE", 40, GREEN, 0.82, "left", 900);
    text(120, HEIGHT-160, `NEXT: ${nextLabel}`, 30, GREEN_DIM, 0.90, "left", 700);
    text(120, HEIGHT-115, "INFECFREAK>", 30, GREEN, 0.70, "left", 700);
  }

  // typewriter helper
  function typewriterLine(x, y, full, t, startAt, cps, size, color, alpha, weight){
    // t in seconds, startAt in seconds
    const dt = t - startAt;
    if (dt <= 0) return 0;
    const chars = Math.min(full.length, Math.floor(dt * cps));
    if (chars > 0) text(x, y, full.slice(0, chars), size, color, alpha, "left", weight);
    return chars;
  }

  // ===== screens =====
  function screenRoot(){
    state.passlineHit = null;

    shadowGlow(1.2);
    text(120, 220, "C:\\INFECFREAK\\", 46, GREEN, 0.90, "left", 800);
    text(120, 290, "MODE: EASTER_EGG", 34, GREEN_DIM, 0.90, "left", 600);

    ctx.save();
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = GREEN;
    ctx.fillRect(120, 380, WIDTH-240, 2);
    ctx.restore();

    text(120, 430, "PRESS ENTER TO EXECUTE", 44, GREEN, 0.92, "left", 900);
    text(120, 500, "NEXT: SCAN", 30, GREEN_DIM, 0.95, "left", 700);

    // ✅ prompt no repite la ruta
    const prompt = "INFECFREAK>";
    text(120, 620, prompt, 36, GREEN, 0.85, "left", 800);

    const blink = Math.floor((now()/1000) * 2) % 2 === 0;
    if (blink){
      ctx.save();
      ctx.globalAlpha = 0.65;
      ctx.fillStyle = GREEN;
      ctx.fillRect(120 + ctx.measureText(prompt).width + 10, 628, 18, 26);
      ctx.restore();
    }

    text(120, HEIGHT-170, "TIP: Enter para avanzar. R para reiniciar.", 24, GREEN_FAINT, 0.9, "left", 600);
  }

  function screenScan(){
    state.passlineHit = null;

    const t = sinceScreenStart();

    shadowGlow(1.05);
    text(120, 240, "SYSTEM ONLINE", 56, GREEN, 0.92, "left", 900);
    text(120, 330, "TARGET FOUND", 56, GREEN, 0.92, "left", 900);

    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = GREEN;
    ctx.lineWidth = 2;
    ctx.strokeRect(110, 450, WIDTH-220, 140);
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = GREEN;
    ctx.fillRect(110, 450, WIDTH-220, 140);
    ctx.restore();

    text(140, 480, EVENT.title, 82, GREEN, 0.95, "left", 900);
    text(140, 585, "CLASSIFICATION: ACTIVE", 34, GREEN_DIM, 0.90, "left", 650);

    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = GREEN;
    ctx.fillRect(120, 700, WIDTH-240, 2);
    ctx.restore();

    // ✅ RUN scan.exe line (typewriter) before scanning starts
    const runY = 740;
    const runFull = "INFECFREAK> RUN scan.exe";
    const runStart = 0.15;
    const runCps = 28; // chars per second (feel)
    const typed = typewriterLine(120, runY, runFull, t, runStart, runCps, 34, GREEN, 0.88, 800);

    // scanning text appears after run line finishes (+ small delay)
    const runDoneAt = runStart + (runFull.length / runCps) + 0.20;
    if (t >= runDoneAt) text(120, 800, "SCANNING SPECIMENS", 44, GREEN, 0.80, "left", 800);

    drawGrid();

    // animated reveal: one name every 0.65s after scanning begins
    const leadIn = runDoneAt + 0.15;
    const step = 0.65;
    const count = Math.max(0, Math.min(EVENT.lineup.length, Math.floor((t - leadIn) / step) + 1));

    const baseX = 120, baseY = 880, lh = 70;
    for (let i=0;i<count;i++){
      const y = baseY + i*lh;
      const name = EVENT.lineup[i];
      const isLast = name === "P4R4S1T0";

      if (Math.abs((t - leadIn) - i*step) < 0.03 && Math.random() < 0.6) chirp();

      text(baseX, y, `SPECIMEN: ${name}`, 52, GREEN, isLast ? 0.98 : 0.86, "left", isLast ? 900 : 650);

      ctx.save();
      ctx.globalAlpha = isLast ? 0.24 : 0.12;
      ctx.fillStyle = GREEN;
      ctx.fillRect(baseX, y+60, isLast ? 860 : 700, 2);
      ctx.restore();
    }

    drawBottomPrompt("ACCESS");
  }

  function screenAccess(){
    state.passlineHit = null;

    const t = sinceScreenStart();

    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,WIDTH,HEIGHT);
    ctx.restore();

    const x=90, y=320, w=WIDTH-180, h=900;

    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = RED;
    ctx.fillRect(x,y,w,h);
    ctx.globalAlpha = 0.10;
    ctx.strokeStyle = RED;
    ctx.lineWidth = 2;
    ctx.strokeRect(x,y,w,h);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = RED;
    ctx.font = `900 170px ui-monospace, Menlo, Consolas, monospace`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("ACCESO", WIDTH/2, y + 160);
    ctx.restore();

    shadowGlow(1.15);

    // ✅ RUN access.exe line (typewriter) first
    const runY = y + 250;
    const runFull = "INFECFREAK> RUN access.exe";
    const runStart = 0.15;
    const runCps = 26;
    typewriterLine(x+60, runY, runFull, t, runStart, runCps, 34, GREEN, 0.88, 800);

    const runDoneAt = runStart + (runFull.length / runCps) + 0.25;

    const items = [
      `LUGAR: ${EVENT.location}`,
      `HORA: ${EVENT.time}`,
      EVENT.prices[0],
      EVENT.prices[1],
      "FECHA: 24 ENERO",
      EVENT.title
    ];

    const leadIn = runDoneAt + 0.15;
    const step = 0.55;
    const count = Math.max(0, Math.min(items.length, Math.floor((t - leadIn) / step) + 1));

    let yy = y + 330;
    for (let i=0;i<count;i++){
      const s = items[i];

      if (i === 2 || i === 3) {
        text(x+60, yy, s, 64, GREEN, 0.96, "left", 900);
        yy += 96;
      } else if (i === 5) {
        yy += 10;
        text(x+60, yy, s, 58, GREEN, 0.92, "left", 900);
        yy += 84;
      } else {
        text(x+60, yy, s, 48, GREEN, 0.92, "left", 900);
        yy += 76;
      }

      if (Math.abs((t - leadIn) - i*step) < 0.03 && Math.random() < 0.7) doom();
    }

    drawBottomPrompt("TICKETS");
  }

  function screenTickets(){
    ctx.save();
    ctx.globalAlpha = 0.86;
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,WIDTH,HEIGHT);
    ctx.restore();

    shadowGlow(1.25);

    text(120, 360, "TICKETS DISPONIBLES EN PASSLINE", 52, GREEN, 0.95, "left", 900);
    text(120, 430, "INFECFREAK FEST — FORO DMT, COLIMA", 34, GREEN_DIM, 0.95, "left", 700);

    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = GREEN;
    ctx.fillRect(120, 520, WIDTH-240, 2);
    ctx.restore();

    const bx = 120, by = 610, bw = 840, bh = 120;

    ctx.save();
    ctx.globalAlpha = 0.14;
    ctx.fillStyle = GREEN;
    ctx.fillRect(bx, by, bw, bh);
    ctx.globalAlpha = 0.14;
    ctx.strokeStyle = GREEN;
    ctx.lineWidth = 3;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.restore();

    text(bx+40, by+32, "CLICK AQUI PARA COMPRAR", 46, GREEN, 0.95, "left", 900);
    text(bx+40, by+82, "PASSLINE", 30, GREEN_DIM, 0.95, "left", 700);

    state.passlineHit = { x: bx, y: by, w: bw, h: bh };

    text(120, 800, "PREVENTA $100  •  GENERAL $150", 40, GREEN, 0.85, "left", 800);
    text(120, 860, "INICIO 7:00 PM", 40, GREEN, 0.85, "left", 800);

    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = GREEN;
    ctx.fillRect(120, 980, 680, 2);
    ctx.restore();

    drawBottomPrompt("RETURN TO ROOT");
    text(120, HEIGHT-140, "LOG: INFECFREAK_EG.v11", 34, GREEN_DIM, 0.85, "left", 700);
  }

  function render(){
    clear();
    frameBorder();

    if (state.screen !== 3) state.passlineHit = null;

    if (state.screen === 0) screenRoot();
    if (state.screen === 1) screenScan();
    if (state.screen === 2) screenAccess();
    if (state.screen === 3) screenTickets();

    if (now() < state.glitchUntil) interference();
    if (now() < state.bendUntil) databend();

    requestAnimationFrame(render);
  }

  function advance(){
    state.screen = (state.screen + 1) % 4;
    state.screenStartMs = now();

    doom();
    state.glitchUntil = now() + 220;
    state.bendUntil = now() + 260;
  }

  function reset(){
    state.screen = 0;
    state.screenStartMs = now();
    state.passlineHit = null;

    chirp();
    state.glitchUntil = now() + 160;
    state.bendUntil = now() + 180;
  }

  window.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { advance(); e.preventDefault(); return; }
    if (e.key.toLowerCase() === "r") { reset(); e.preventDefault(); return; }
  });

  canvas.addEventListener("click", (ev) => {
    if (!state.passlineHit) return;

    const rect = canvas.getBoundingClientRect();
    const x = (ev.clientX - rect.left) * (WIDTH / rect.width);
    const y = (ev.clientY - rect.top)  * (HEIGHT / rect.height);

    const hit = state.passlineHit;
    const inside = x >= hit.x && x <= (hit.x + hit.w) && y >= hit.y && y <= (hit.y + hit.h);
    if (inside) window.open(PASSLINE_URL, "_blank", "noopener,noreferrer");
  });

  render();
})();
</script>
</body>
</html>
